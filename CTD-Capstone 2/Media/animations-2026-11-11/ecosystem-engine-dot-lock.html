<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetamorphUs: The Ecosystem Engine with the dot lock</title>
<!--
  Animation of "Option 2: The Ecosystem Engine" from MetamorphUs: Suggested Controller Setups V2 (Nov 11, 2026).
  Illustrative mockup, not a working prototype. Single file, no dependencies.
  - Four people stand on floor dots, each running one machine (Sun crank, Water pump, Wind bellows, Roots drum).
  - Machines run down when you stop. Stepping off your dot makes your element fade (the dot lock).
  - When all four are balanced and held for 8 seconds, the whole world breaks into petals that come together
    into a rainbow butterfly made of flowers. It flies and flaps until someone steps off their dot.
  - "Record video" saves one full play as a video file (MP4 in recent Chrome, otherwise WebM).
  - URL options: ?t=40 (jump to 40 s, paused)   ?clean=1 (hide title, meters, captions and bubbles for stills)
-->
<style>
  html,body{margin:0;background:#111317;color:#e8e4da;font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif}
  #wrap{width:min(1280px,calc(100vw - 32px),calc((100vh - 190px)*16/9));margin:14px auto}
  canvas{width:100%;display:block;border-radius:8px;background:#000}
  .bar{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
  button{background:#262a33;color:#e8e4da;border:1px solid #3a3f4b;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
  button:hover{background:#30353f}
  #scrub{flex:1;min-width:200px;accent-color:#f2c14e}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:#9aa0aa}
  .chapters{display:flex;flex-wrap:wrap;gap:6px}
  .chapters button{font-size:12px;padding:3px 8px}
  .chapters button.cur{border-color:#f2c14e;color:#f2c14e}
  .hint{color:#8b909a;font-size:12.5px;margin:8px 0 0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="bar">
    <button id="play">Pause</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline">
    <span id="time" class="mono">0:00</span>
    <button id="rec">Record video</button>
  </div>
  <div class="chapters" id="chap"></div>
  <p class="hint">Illustrative mockup of Option 2 (The Ecosystem Engine) with the dot lock. An idea to test, not a decision.</p>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const W = 1280, H = 720, cv = $('c'), g = cv.getContext('2d');
cv.width = W; cv.height = H;
const TAU = Math.PI * 2;
const SANS = '-apple-system, "Helvetica Neue", Arial, sans-serif';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => x * x * (3 - 2 * x);
const lerp = (a, b, x) => a + (b - a) * x;
const mix = (c1, c2, x) => `rgb(${c1.map((v, i) => Math.round(lerp(v, c2[i], clamp(x)))).join(',')})`;
const rand = (i) => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ---------- the four roles ----------
const ROLES = [
  { name: 'SUN',   action: 'Crank the sun wheel',   color: '#f2b632', rgb: [242, 182, 50],  x: 200 },
  { name: 'WATER', action: 'Pump the hand pump',    color: '#3fa3e0', rgb: [63, 163, 224],  x: 430 },
  { name: 'WIND',  action: 'Squeeze the bellows',   color: '#7fd1c7', rgb: [127, 209, 199], x: 660 },
  { name: 'ROOTS', action: 'Stomp the drum pad',    color: '#8bc34a', rgb: [139, 195, 74],  x: 890 },
];
const DOT_Y = 655, ARRIVE = [7, 9, 11, 13], WALK = 1.5;
const BAND = [0.45, 0.75], HOLD_NEEDED = 8, GRACE = 2;
const OFF = [39.3, 43.2]; // the Wind person steps off their dot to try the Roots machine
const STEPOFF = 71;        // the Sun person leaves after the butterfly has flown (must be after the reveal, ~53 s)

const arrived = (i, t) => t >= ARRIVE[i] + WALK;
const onDot = (i, t) => arrived(i, t) && !(i === 2 && t >= OFF[0] && t < OFF[1]) && !(i === 0 && t >= STEPOFF);
// how hard each person works (1 = a steady, healthy pace)
function speed(i, t) {
  if (!onDot(i, t)) return 0;
  if (i === 0) return t < 23 ? 0.6 : t < 29.5 ? 1 : t < 35 ? 1.7 : 1;
  return 1;
}

// ---------- simulate once (deterministic, so scrubbing works) ----------
const FPS = 60, SIM_T = 95, N = SIM_T * FPS;
const simL = ROLES.map(() => new Float32Array(N + 1));
const simPh = ROLES.map(() => new Float32Array(N + 1));
const simOff = ROLES.map(() => new Float32Array(N + 1));
const simHold = new Float32Array(N + 1);
let REVEAL = 53;
(function simulate() {
  const L = [0, 0, 0, 0], ph = [0, 0, 0, 0], off = [0, 0, 0, 0];
  let hold = 0, revealAt = null;
  const dt = 1 / FPS;
  for (let k = 0; k <= N; k++) {
    const t = k * dt;
    for (let i = 0; i < 4; i++) {
      const s = speed(i, t);
      if (onDot(i, t)) {
        off[i] = 0;
        const target = Math.min(1, 0.6 * s);
        L[i] += (target - L[i]) * dt * 0.6;
      } else {
        off[i] += dt;
        if (arrived(i, t) && off[i] > GRACE) L[i] += (0 - L[i]) * dt * 0.8;
      }
      ph[i] += dt * TAU * 0.7 * s;
      simL[i][k] = L[i]; simPh[i][k] = ph[i]; simOff[i][k] = arrived(i, t) ? off[i] : 0;
    }
    if (revealAt === null) {
      const allIn = L.every((v) => v >= BAND[0] && v <= BAND[1]) && [0, 1, 2, 3].every((i) => onDot(i, t));
      hold = allIn ? hold + dt : 0;
      if (hold >= HOLD_NEEDED) revealAt = t;
    }
    simHold[k] = revealAt === null ? hold : HOLD_NEEDED;
  }
  REVEAL = revealAt ?? 53;
})();
// ending phases
const D0 = REVEAL + 1.5;       // the world starts breaking into petals
const G0 = REVEAL + 3.2;       // petals start gathering into the butterfly
const FLY = REVEAL + 6;        // the butterfly starts flying around
const BURST = STEPOFF + GRACE; // someone left their dot: the butterfly scatters
const END_CARD = BURST + 5, T = END_CARD + 4;
const at = (arr, t) => arr[Math.min(N, Math.max(0, Math.round(t * FPS)))];

// ---------- story text ----------
const CAPTIONS = [
  [0, 'A dying world. Four empty dots wait in front of the screen.'],
  [6.5, 'Step on a dot to take a role. Your machine wakes up.'],
  [15, 'Each machine powers one element. Stop working and it runs down.'],
  [21, 'Too little sun. Strangers call out what they see.'],
  [29.5, 'Too much! Cranking too fast scorches the land.'],
  [36.6, 'Back in balance…'],
  [39.3, 'The dot lock: step off your dot and your element fades. One person can’t run two machines.'],
  [45, 'Everyone back on their dots. Hold the balance together.'],
  [REVEAL, 'Balanced long enough: the whole world blooms…'],
  [D0, '…then breaks into petals that swirl together…'],
  [G0 + 0.8, '…and come together into a butterfly made of flowers.'],
  [FLY + 0.5, 'It flies and flaps as long as everyone stays on their dots.'],
  [STEPOFF, 'Someone steps off their dot: the butterfly scatters, and the world waits for the next group.'],
];
const CHAPTERS = [[0, 'Dying world'], [6.5, 'Take a role'], [15, 'Machines run down'], [21, 'Too little'], [29.5, 'Too much'], [39.3, 'Dot lock'], [45, 'Hold together'], [REVEAL, 'Bloom'], [D0, 'Petals'], [FLY, 'Butterfly flies'], [STEPOFF, 'Step off']];
const BUBBLES = [
  [21.5, 24, 3, 'More sun!'],
  [31, 34, 1, 'Slow down! It’s scorching!'],
  [39.5, 41.2, 2, 'I’ll do both!'],
  [41.5, 43.2, 1, 'Wind’s dying, get back!'],
  [47, 50.5, 0, 'Hold it… hold it…'],
  [STEPOFF + 0.2, STEPOFF + 2.2, 0, 'Okay, I’m done!'],
  [STEPOFF + 2.6, STEPOFF + 5, 1, 'Nooo, the butterfly!'],
];

// ---------- person position ----------
function personPos(i, t) {
  const x0 = ROLES[i].x;
  if (t < ARRIVE[i]) return null;
  const w = ease(ramp(t, ARRIVE[i], ARRIVE[i] + WALK));
  let x = x0, y = lerp(800, DOT_Y, w);
  if (i === 2) {
    const go = ease(ramp(t, OFF[0], OFF[0] + 0.9)), back = ease(ramp(t, OFF[1] - 0.9, OFF[1]));
    x = lerp(x0, x0 + 150, go * (1 - back));
  }
  if (i === 0 && t >= STEPOFF) x = x0 - 110 * ease(ramp(t, STEPOFF, STEPOFF + 0.9));
  return { x, y };
}

// ---------- screen (the ecosystem) ----------
// Barren = flat grey-brown dust, bare dead trees, cracked ground.
// Balanced = a glowing night forest (inspired by teamLab's "Story of the Forest" photos): indigo sky and stars,
// luminous trunks, violet/teal canopies, mint palms, mist, deer, fireflies, falling light and petals.
const SX = 140, SY = 52, SW = 1000, SH = 360, GY = SY + 298;
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mixc = (a, b, x) => a.map((v, i) => Math.round(lerp(v, b[i], clamp(x))));
const qb = (a, b, c, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * b + u * u * c;
const hslRgb = (h, s, l) => {
  const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [255 * f(0), 255 * f(8), 255 * f(4)].map(Math.round);
};
let SCENE_H = 0, WIND_PH = 0, WIND_LVL = 0; // WIND_PH = how far the wind has pushed things (smooth even when wind changes) // overall health, shared with the room floor so the screen's glow spills onto it

const TREES = [], STARS = [], CRACKS = [], GRASS = [], PETALS = [];
(function buildForest() {
  let seed = 500;
  const rnd = () => rand(seed++ * 0.731);
  const spots = [[60, 'broad', 170], [150, 'broad', 200], [250, 'palm', 230], [350, 'broad', 185], [450, 'broad', 210],
    [545, 'broad', 175], [640, 'palm', 215], [735, 'broad', 190], [830, 'broad', 160], [930, 'palm', 200]];
  spots.forEach(([dx, type, H]) => {
    const x = SX + dx, tr = { x, type, H, branches: [], leaves: [], fronds: [], lean: (rnd() - 0.5) * 30 };
    if (type === 'broad') {
      const topY = GY - H * 0.5;
      tr.top = { x, y: topY };
      for (let k = 0; k < 5; k++) {
        const a = ((25 + k * 32.5 + (rnd() - 0.5) * 14) * Math.PI) / 180, len = H * 0.33 * (0.8 + 0.4 * rnd());
        const ex = x + Math.cos(a) * len, ey = topY - Math.sin(a) * len;
        tr.branches.push([x, topY, ex, ey, 3]);
        for (const s of [-1, 1]) { const b = a + s * 0.45, l2 = len * 0.5; tr.branches.push([ex, ey, ex + Math.cos(b) * l2, ey - Math.sin(b) * l2, 1.6]); }
      }
      const cx = x, cy = topY - H * 0.22;
      for (let k = 0; k < 38; k++) {
        const th = rnd() * TAU, rr = Math.sqrt(rnd()), fam = k % 4;
        // each leaf belongs to one element: sun = reds/oranges/yellows, water = blues, wind = purples, roots = greens/teals
        const hue = [rnd() * 50, 195 + rnd() * 30, 262 + rnd() * 38, 128 + rnd() * 42][fam];
        tr.leaves.push({ x: cx + Math.cos(th) * H * 0.42 * rr, y: cy + Math.sin(th) * H * 0.28 * rr, r: 9 + rnd() * 10,
          hue, fam, thr: rnd() * 0.75, o: rnd() * TAU });
      }
    } else {
      tr.top = { x: x + tr.lean, y: GY - H * 0.85 };
      for (let k = 0; k < 9; k++) tr.fronds.push({ a: Math.PI * (0.05 + k * 0.1125), len: H * 0.3 * (0.8 + 0.4 * rnd()), thr: rnd() * 0.6 });
    }
    TREES.push(tr);
  });
  for (let i = 0; i < 160; i++) STARS.push({ x: SX + rnd() * SW, y: SY + rnd() * (GY - SY - 40), r: rnd() < 0.85 ? 1.2 : 2.2, ph: rnd() * TAU });
  for (let i = 0; i < 14; i++) {
    let x = SX + rnd() * SW, y = GY + 6 + rnd() * 45; const pts = [[x, y]];
    for (let k = 0; k < 4; k++) { x += 10 + rnd() * 22; y += (rnd() - 0.5) * 12; pts.push([x, y]); }
    CRACKS.push(pts);
  }
  for (let i = 0; i < 110; i++) GRASS.push({ x: SX + rnd() * SW, y: GY + 2 + rnd() * 52, h: 0.6 + rnd() * 0.8, flower: rnd() < 0.16 });
  const flowerHues = [340, 355, 20, 45, 285, 300, 0];
  for (let i = 0; i < 90; i++) {
    const hue = flowerHues[i % flowerHues.length];
    PETALS.push({ rgb: hue === 0 ? [255, 245, 250] : hslRgb(hue, 0.85, 0.68), sp: 50 + rnd() * 90, x0: rnd() * 2000, y0: rnd(), ph: rnd() * TAU });
  }
})();

function drawSun(t, s, h, scorch) {
  const x = SX + 110, y = GY - 50 - s * 190;
  if (s > 0.05) {
    g.globalCompositeOperation = 'lighter';
    const R = 40 + 80 * s + 70 * scorch;
    const glow = g.createRadialGradient(x, y, 0, x, y, R);
    const gc = mixc([255, 222, 160], [255, 140, 50], scorch);
    glow.addColorStop(0, rgba(gc, 0.45 * s * (0.35 + 0.65 * h) + 0.3 * scorch)); glow.addColorStop(1, rgba(gc, 0));
    g.fillStyle = glow; g.beginPath(); g.arc(x, y, R, 0, TAU); g.fill();
    g.globalCompositeOperation = 'source-over';
  }
  g.fillStyle = rgba(mixc(mixc([128, 122, 112], [255, 242, 214], h * s), [255, 170, 80], scorch), 0.55 + 0.45 * s);
  g.beginPath(); g.arc(x, y, 18 + 8 * s, 0, TAU); g.fill();
}

function drawRain(t, w, h) {
  const count = Math.floor(w * 36);
  g.globalCompositeOperation = h > 0.4 ? 'lighter' : 'source-over';
  g.strokeStyle = rgba(mixc([150, 148, 142], [215, 232, 255], h), 0.3 + 0.4 * h); g.lineWidth = 1.5;
  for (let i = 0; i < count; i++) {
    const len = 70 + rand(i + 2) * 90;
    const x = SX + rand(i) * (SW + 60);
    const y = SY - len + ((t * 520 + rand(i + 9) * 900) % (SH + len));
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 14, y + len); g.stroke();
  }
  g.globalCompositeOperation = 'source-over';
}

function drawFarForest(h, roots) {
  g.fillStyle = rgba(mixc([74, 70, 64], [36, 28, 100], h), 1);
  g.beginPath(); g.moveTo(SX, GY);
  for (let x = 0; x <= SW; x += 14) g.lineTo(SX + x, GY - 34 - 20 * Math.abs(Math.sin(x * 0.029)) - 14 * rand(x * 0.37));
  g.lineTo(SX + SW, GY); g.closePath(); g.fill();
  if (h > 0.15) {
    g.globalCompositeOperation = 'lighter';
    const m = g.createLinearGradient(0, GY - 60, 0, GY + 10);
    m.addColorStop(0, 'rgba(90,230,210,0)'); m.addColorStop(1, `rgba(90,230,210,${0.3 * h * (0.4 + 0.6 * roots)})`);
    g.fillStyle = m; g.fillRect(SX, GY - 60, SW, 70);
    g.globalCompositeOperation = 'source-over';
  }
}

function drawGround(t, h, water, roots) {
  const gr = g.createLinearGradient(0, GY, 0, SY + SH);
  gr.addColorStop(0, rgba(mixc([98, 90, 78], [26, 30, 84], h), 1));
  gr.addColorStop(1, rgba(mixc([72, 66, 58], [10, 12, 42], h), 1));
  g.fillStyle = gr; g.fillRect(SX, GY, SW, SY + SH - GY);
  const crack = (1 - water) * (1 - h);
  if (crack > 0.02) {
    g.strokeStyle = `rgba(48,43,36,${0.8 * crack})`; g.lineWidth = 1.5;
    CRACKS.forEach((pts) => { g.beginPath(); pts.forEach(([x, y], k) => (k ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); });
  }
  // glowing roots under the soil
  if (h > 0.3) {
    g.globalCompositeOperation = 'lighter';
    g.strokeStyle = `rgba(90,230,210,${0.35 * roots * h})`; g.lineWidth = 1.5;
    TREES.forEach((tr, k) => { for (let r = -1; r <= 1; r++) { g.beginPath(); g.moveTo(tr.x, GY); g.quadraticCurveTo(tr.x + r * 18, GY + 20, tr.x + r * 30 + 6 * rand(k + r), GY + 40 * roots); g.stroke(); } });
    g.globalCompositeOperation = 'source-over';
  }
  // grass: dry stubble when barren, glowing sprigs when alive
  const gcol = mixc([140, 124, 92], [110, 240, 190], h);
  g.strokeStyle = rgba(gcol, 0.6); g.lineWidth = 1.1;
  if (h > 0.4) g.globalCompositeOperation = 'lighter';
  GRASS.forEach((b, i) => {
    const len = lerp(3, 13, roots * h) * b.h, sway = Math.sin(t * 1.5 + WIND_PH * 0.4 + i) * (1.5 + 4 * WIND_LVL) * h;
    for (const d of [-3, 0, 3]) { g.beginPath(); g.moveTo(b.x + d * 0.6, b.y); g.lineTo(b.x + d + sway, b.y - len); g.stroke(); }
  });
  const fl = clamp(h * roots * 1.6 - 0.6);
  if (fl > 0) GRASS.forEach((b) => { if (!b.flower) return; g.fillStyle = `rgba(255,230,120,${0.85 * fl})`; g.beginPath(); g.arc(b.x, b.y - 10 * roots, 2.6, 0, TAU); g.fill(); });
  g.globalCompositeOperation = 'source-over';
}

function drawTree(tr, h, scorch, bloom, t, nr) {
  // nr = each element's level (1 = healthy). A stronger element makes its own colour glow brighter.
  const avg = (nr[0] + nr[1] + nr[2] + nr[3]) / 4 || 1, wind = clamp(nr[2]);
  const grow = lerp(0.8, 1, h);
  const Y = (y) => GY - (GY - y) * grow;
  const trunkC = mixc([86, 82, 76], [205, 220, 255], h);
  g.lineCap = 'round';
  if (tr.type === 'broad') {
    const topY = Y(tr.top.y);
    if (h > 0.2) {
      g.globalCompositeOperation = 'lighter'; g.strokeStyle = `rgba(120,140,255,${0.2 * h})`; g.lineWidth = 18;
      g.beginPath(); g.moveTo(tr.x, GY); g.lineTo(tr.x, topY); g.stroke(); g.globalCompositeOperation = 'source-over';
    }
    g.strokeStyle = rgba(trunkC, 0.95); g.lineWidth = 6;
    g.beginPath(); g.moveTo(tr.x, GY); g.lineTo(tr.x, topY); g.stroke();
    tr.branches.forEach(([x1, y1, x2, y2, w]) => { g.lineWidth = w; g.beginPath(); g.moveTo(x1, Y(y1)); g.lineTo(x2, Y(y2)); g.stroke(); });
    g.globalCompositeOperation = 'lighter';
    tr.leaves.forEach((lf, k) => {
      const a = clamp((h - lf.thr) / 0.25); if (a <= 0) return;
      const rel = clamp(nr[lf.fam] / avg, 0.35, 1.7), wgt = clamp(nr[lf.fam]);
      const hue = lerp(lf.hue, 18, scorch * 0.6);
      const x = lf.x + Math.sin(t * 1.2 + WIND_PH * 0.5 + lf.o) * (1 + 5 * wind), y = Y(lf.y) + Math.cos(t + WIND_PH * 0.4 + lf.o) * 2 * wind;
      for (const [ox, oy, s] of [[0, 0, 1], [lf.r * 0.6, lf.r * 0.3, 0.7], [-lf.r * 0.5, lf.r * 0.4, 0.65]]) {
        g.fillStyle = `hsla(${hue},85%,${34 + 12 * h}%,${0.2 * a * wgt * rel})`;
        g.beginPath(); g.arc(x + ox, y + oy, lf.r * s * (0.75 + 0.3 * rel), 0, TAU); g.fill();
      }
      g.fillStyle = `hsla(${hue},70%,85%,${0.3 * a * wgt})`; g.beginPath(); g.arc(x - lf.r * 0.2, y - lf.r * 0.3, 1.8, 0, TAU); g.fill();
      if (bloom > 0 && k % 3 === 0) {
        const b = clamp(bloom * 1.5 - (k % 7) * 0.08);
        g.fillStyle = `rgba(255,${190 + ((k * 13) % 60)},235,${0.85 * b})`;
        for (let q = 0; q < 5; q++) { const qa = (q / 5) * TAU + lf.o; g.beginPath(); g.arc(x + Math.cos(qa) * 4, y + Math.sin(qa) * 4, 3 * b, 0, TAU); g.fill(); }
      }
    });
    g.globalCompositeOperation = 'source-over';
    if (h < 0.5) { // a few dry leaves still cling on
      g.fillStyle = `rgba(112,96,72,${0.7 * (1 - h * 2)})`;
      tr.branches.forEach(([, , x2, y2], k) => { if (k % 2) { g.beginPath(); g.ellipse(x2, Y(y2) + 4, 3, 2, k, 0, TAU); g.fill(); } });
    }
  } else {
    const topX = tr.top.x, topY = Y(tr.top.y), midY = (GY + topY) / 2;
    if (h > 0.2) {
      g.globalCompositeOperation = 'lighter'; g.strokeStyle = `rgba(150,140,255,${0.2 * h})`; g.lineWidth = 18;
      g.beginPath(); g.moveTo(tr.x, GY); g.quadraticCurveTo(tr.x, midY, topX, topY); g.stroke(); g.globalCompositeOperation = 'source-over';
    }
    g.strokeStyle = rgba(trunkC, 0.95); g.lineWidth = 7;
    g.beginPath(); g.moveTo(tr.x, GY); g.quadraticCurveTo(tr.x, midY, topX, topY); g.stroke();
    if (h > 0.3) { // glowing rings up the trunk
      g.strokeStyle = `rgba(235,240,255,${0.7 * h})`; g.lineWidth = 2;
      for (let k = 1; k < 11; k++) { const u = k / 11, px = qb(tr.x, tr.x, topX, u), py = qb(GY, midY, topY, u); g.beginPath(); g.moveTo(px - 5, py); g.lineTo(px + 5, py - 2); g.stroke(); }
    }
    tr.fronds.forEach((f0) => {
      const f = { ...f0, a: f0.a + Math.sin(t * 1.3 + WIND_PH * 0.5 + f0.len) * 0.13 * wind };
      const live = clamp((h - f.thr) / 0.35), sag = lerp(1.1, 0.35, live);
      const ex = topX + Math.cos(f.a) * f.len, ey = topY - Math.sin(f.a) * f.len * 0.5 + f.len * sag * 0.6;
      const cx = topX + Math.cos(f.a) * f.len * 0.5, cy = topY - Math.sin(f.a) * f.len * 0.6;
      const col = mixc(mixc([120, 104, 78], [150, 255, 210], live), [255, 150, 60], scorch * 0.7);
      if (live > 0) g.globalCompositeOperation = 'lighter';
      g.strokeStyle = rgba(col, 0.5 + 0.4 * live); g.lineWidth = 2;
      g.beginPath(); g.moveTo(topX, topY); g.quadraticCurveTo(cx, cy, ex, ey); g.stroke();
      for (let s = 1; s <= 8; s++) {
        const u = s / 9, px = qb(topX, cx, ex, u), py = qb(topY, cy, ey, u), l = (1 - u * 0.5) * (0.4 + 0.6 * live);
        g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(f.a + 1.2) * 8 * l, py + 9 * l); g.stroke();
      }
      g.globalCompositeOperation = 'source-over';
    });
    if (h > 0.3) {
      g.globalCompositeOperation = 'lighter';
      const cg = g.createRadialGradient(topX, topY, 0, topX, topY, 55);
      cg.addColorStop(0, `rgba(150,255,210,${0.3 * h})`); cg.addColorStop(1, 'rgba(150,255,210,0)');
      g.fillStyle = cg; g.beginPath(); g.arc(topX, topY, 55, 0, TAU); g.fill();
      g.globalCompositeOperation = 'source-over';
    }
  }
}

function drawDeer(t, h, roots) {
  const a = clamp((h - 0.65) / 0.25) * clamp(roots);

  [[SX + 330, 1, 1.15], [SX + 775, -1, 1]].forEach(([x, dir, s], k) => {

    g.beginPath(); g.ellipse(0, -22, 16, 7.5, 0, 0, TAU); g.fill();
    [[-11, -12], [-6, -5], [8, 9], [12, 13]].forEach(([x1, x2]) => { g.beginPath(); g.moveTo(x1, -17); g.lineTo(x2, 0); g.stroke(); });
    g.save(); g.translate(12, -26); g.rotate(graze);

    g.beginPath(); g.ellipse(9, -15, 6, 3.6, 0.35, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(5, -20, 1.6, 4, -0.4, 0, TAU); g.fill();
    g.restore();
    g.restore();
  });
}

function drawPetals(t, w, h, bloom) {
  const count = Math.floor(w * 55 + bloom * 30);
  for (let i = 0; i < Math.min(count, PETALS.length); i++) {
    const p = PETALS[i];
    const x = SX + ((p.x0 + t * p.sp * 0.3 + WIND_PH * p.sp * 0.25) % (SW + 40)) - 20;
    const y = SY + 20 + p.y0 * (GY - SY - 10) + Math.sin(t * 1.5 + p.ph) * 14;
    const c = mixc([128, 108, 80], p.rgb, h);

    g.beginPath(); g.ellipse(x, y, 4.5, 2.4, t * 2 + p.ph, 0, TAU); g.fill();
  }
}

function drawScreen(t, L, health, scorch, bloom) {
  const h = health, n = L.map((v) => clamp(v / 0.6)), nr = L.map((v) => v / 0.6);
  WIND_PH = at(simPh[2], t); WIND_LVL = n[2];
  // the horizon takes the colour of whichever element is strongest
  const TINTS = [[190, 88, 50], [34, 80, 176], [104, 42, 168], [30, 120, 92]];
  const wts = nr.map((v) => v * v), tw = wts.reduce((a, b) => a + b, 0) || 1;
  const horizon = [0, 1, 2].map((c) => TINTS.reduce((sum, col, i) => sum + (col[c] * wts[i]) / tw, 0));
  g.save();
  g.fillStyle = '#0b0c0f'; g.fillRect(SX - 10, SY - 10, SW + 20, SH + 20);
  g.beginPath(); g.rect(SX, SY, SW, SH); g.clip();
  const sky = g.createLinearGradient(0, SY, 0, GY);
  sky.addColorStop(0, rgba(mixc([66, 63, 60], [8, 10, 40], h), 1));
  sky.addColorStop(1, rgba(mixc([100, 95, 88], mixc([48, 40, 124], horizon, 0.65), h), 1));
  g.fillStyle = sky; g.fillRect(SX, SY, SW, SH);
  g.globalCompositeOperation = 'lighter';
  STARS.forEach((s) => {
    const a = h * h * (0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * 2 + s.ph)));
    if (a > 0.02) { g.fillStyle = `rgba(220,225,255,${a})`; g.fillRect(s.x, s.y, s.r, s.r); }
  });
  g.globalCompositeOperation = 'source-over';
  drawSun(t, n[0], h, scorch);
  drawRain(t, n[1], h);
  drawFarForest(h, n[3]);
  drawGround(t, h, n[1], n[3]);
  TREES.forEach((tr) => drawTree(tr, h, scorch, bloom, t, nr));
  drawDeer(t, h, n[3]);
  if (h > 0.5) { // fireflies
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 40; i++) {
      const a = (h - 0.5) * 2 * (0.5 + 0.5 * Math.sin(t * 3 + i));
      g.fillStyle = `rgba(230,255,160,${0.8 * a})`;
      g.beginPath(); g.arc(SX + rand(i + 70) * SW + Math.sin(t * 0.5 + i) * 20, GY - 15 - rand(i + 90) * 130 + Math.cos(t * 0.7 + i) * 10, 1.8, 0, TAU); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
  }
  drawPetals(t, n[2], h, bloom);
  if (h < 0.6) { // dust haze over the barren land
    g.fillStyle = `rgba(185,175,155,${(0.6 - h) * 0.45})`;
    for (let i = 0; i < 70; i++) g.fillRect(SX + ((rand(i + 300) * SW + t * 9) % SW), SY + rand(i + 400) * SH, 1.6, 1.6);
  }
  if (bloom > 0) { // big glowing flowers drifting down, like the teamLab ceiling
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 22; i++) {
      const x = SX + rand(i + 500) * SW, y = SY - 20 + ((t * 30 + rand(i + 600) * 400) % (SH + 40)), r = 6 + rand(i + 700) * 7;
      const c = hslRgb([330, 350, 20, 280, 300, 45][i % 6], 0.85, 0.7);
      g.fillStyle = rgba(c, 0.75 * bloom);
      for (let q = 0; q < 6; q++) { const qa = (q / 6) * TAU + t * 0.4 + i; g.beginPath(); g.ellipse(x + Math.cos(qa) * r * 0.6, y + Math.sin(qa) * r * 0.6, r * 0.6, r * 0.3, qa, 0, TAU); g.fill(); }
    }
    g.globalCompositeOperation = 'source-over';
  }
  if (scorch > 0) { g.fillStyle = `rgba(255,120,30,${0.22 * scorch})`; g.fillRect(SX, SY, SW, SH); }
  g.restore();
  g.strokeStyle = '#2b2f38'; g.lineWidth = 4; g.strokeRect(SX - 10, SY - 10, SW + 20, SH + 20);
}

// ---------- the ending: world -> petals -> flower butterfly ----------
const S_BF = 150, FOCAL = 650, BF_CX = SX + SW / 2, BF_CY = SY + 175;
function ell(u, v, cx, cy, rx, ry, r) {
  const du = u - cx, dv = v - cy;
  const x = du * Math.cos(r) + dv * Math.sin(r), y = -du * Math.sin(r) + dv * Math.cos(r);
  return (x / rx) ** 2 + (y / ry) ** 2 <= 1;
}
// one wing = a big upper ellipse + a smaller lower one (u = out from the body, v = down)
const inWing = (u, v) => u > 0.04 && (ell(u, v, 0.55, -0.32, 0.58, 0.42, -0.45) || ell(u, v, 0.38, 0.35, 0.36, 0.3, 0.55));

// Build the butterfly once: rainbow blossoms packed into both wings, a body, and loose petals around it.
// Each piece also remembers where it came from in the world, so the world itself becomes the butterfly.
const BF = [];
(function buildButterfly() {
  let seed = 1;
  const rnd = () => rand(seed++ * 1.37);
  const PER_SIDE = 230;
  for (const side of [1, -1]) {
    let n = 0;
    while (n < PER_SIDE) {
      const u = 0.04 + rnd() * 1.15, v = -0.95 + rnd() * 1.75;
      if (!inWing(u, v)) continue;
      const d = Math.hypot(u, v);
      BF.push({ kind: 'bloom', side, u, v, size: 0.75 + rnd() * 0.5, hue: (d * 280 + rnd() * 50 + (v > 0 ? 140 : 0)) % 360 });
      n++;
    }
  }
  for (let k = 0; k < 14; k++) BF.push({ kind: 'bloom', side: 1, u: 0, v: -0.3 + k * 0.055, size: 0.55, hue: 40 + k * 4 });
  for (let k = 0; k < 320; k++) {
    const b = BF[Math.floor(rnd() * PER_SIDE * 2)];
    BF.push({ kind: 'petal', side: b.side, u: b.u + (rnd() - 0.5) * 0.4, v: b.v + (rnd() - 0.5) * 0.4, size: 1, hue: rnd() * 360 });
  }
  const broad = TREES.filter((tr) => tr.type === 'broad'), palms = TREES.filter((tr) => tr.type === 'palm');
  BF.forEach((p) => {
    p.r1 = rnd(); p.r2 = rnd(); p.r3 = rnd();
    const reg = rnd();
    if (reg < 0.45) { const tr = broad[Math.floor(rnd() * broad.length)], lf = tr.leaves[Math.floor(rnd() * tr.leaves.length)]; p.ox = lf.x; p.oy = lf.y; p.orgb = hslRgb(lf.hue, 0.75, 0.62); }
    else if (reg < 0.55) { const tr = palms[Math.floor(rnd() * palms.length)]; p.ox = tr.top.x + (rnd() - 0.5) * 80; p.oy = tr.top.y + (rnd() - 0.3) * 40; p.orgb = [150, 255, 210]; }
    else if (reg < 0.7) { p.ox = SX + rnd() * SW; p.oy = GY + rnd() * (SY + SH - GY); p.orgb = [90, 220, 190]; }
    else if (reg < 0.76) { p.ox = SX + 110 + (rnd() - 0.5) * 50; p.oy = GY - 240 + (rnd() - 0.5) * 50; p.orgb = [255, 236, 200]; }
    else { p.ox = SX + rnd() * SW; p.oy = SY + rnd() * (GY - SY - 60); p.orgb = [205, 215, 255]; }
    p.trgb = hslRgb(p.hue, 0.85, p.kind === 'petal' ? 0.75 : 0.62);
  });
})();

// Where the butterfly is and how it is turned at time t (it freezes at the moment it scatters).
function pose(t) {
  if (t >= BURST) t = BURST;
  if (t < FLY) return { px: BF_CX, py: BF_CY, pz: 0, yaw: 0, pitch: 0.2, flap: 0.35 + 0.3 * Math.sin(t * 3) };
  const tau = t - FLY, a = ease(ramp(tau, 0, 2.5));
  return {
    px: BF_CX + a * 320 * Math.sin(0.33 * tau),
    py: BF_CY + a * 55 * Math.sin(0.66 * tau),
    pz: a * 280 * Math.sin(0.25 * tau),        // negative = closer to us (bigger), positive = farther (smaller)
    yaw: a * 0.9 * Math.cos(0.33 * tau),       // turns toward where it's flying
    pitch: 0.2 + a * 0.35 * Math.sin(0.5 * tau + 1),
    flap: 0.35 + 0.75 * Math.sin(t * 5.5),
  };
}
// A point on the butterfly (u, v on one wing) seen in 3D with perspective.
function project(u, v, side, P) {
  const x0 = side * u * Math.cos(P.flap), z0 = -u * Math.sin(P.flap), y0 = v;
  const ca = Math.cos(P.pitch), sa = Math.sin(P.pitch);
  const y1 = y0 * ca - z0 * sa, z1 = y0 * sa + z0 * ca;
  const cy = Math.cos(P.yaw), sy = Math.sin(P.yaw);
  const x2 = x0 * cy + z1 * sy, z2 = -x0 * sy + z1 * cy;
  const depth = P.pz + z2 * S_BF;
  const k = FOCAL / (FOCAL + depth);
  return { x: BF_CX + (P.px - BF_CX + x2 * S_BF) * k, y: BF_CY + (P.py - BF_CY + y1 * S_BF) * k, k, z: depth };
}

function petal(x, y, r, rot, color, alpha) {
  g.globalAlpha = alpha; g.fillStyle = color;
  g.beginPath(); g.ellipse(x, y, r, r * 0.55, rot, 0, TAU); g.fill();
}
function blossom(x, y, r, rot, rgb, alpha) {
  g.globalAlpha = alpha;
  g.fillStyle = `rgb(${rgb.join(',')})`;
  for (let k = 0; k < 5; k++) {
    const a = rot + (k / 5) * TAU;
    g.beginPath(); g.ellipse(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55, r * 0.55, r * 0.32, a, 0, TAU); g.fill();
  }
  g.fillStyle = 'rgba(255,245,200,0.95)';
  g.beginPath(); g.arc(x, y, r * 0.22, 0, TAU); g.fill();
}

function drawEnding(t) {
  if (t < D0 || t > BURST + 3.5) return;
  g.save(); g.beginPath(); g.rect(SX, SY, SW, SH); g.clip();
  const P = pose(t), PB = pose(BURST);
  const C = { x: BF_CX, y: BF_CY };

  // trail of petals shed from the wings while it flies
  const E0 = G0 + 1.6, STEP = 0.04, LIFE = 2.5;
  const kFrom = Math.max(0, Math.ceil((t - LIFE - E0) / STEP)), kTo = Math.floor((Math.min(t, BURST) - E0) / STEP);
  for (let k = kFrom; k <= kTo; k++) {
    const e = E0 + k * STEP, age = t - e;
    if (age < 0 || age > LIFE) continue;
    const tp = project(0.75 + rand(k * 3) * 0.4, -0.6 + rand(k * 3 + 1) * 1.1, k % 2 ? 1 : -1, pose(e));
    const x = tp.x + (rand(k * 3 + 2) - 0.5) * 60 * age, y = tp.y + 30 * age + 30 * age * age;
    const c = hslRgb(rand(k * 7) * 360, 0.85, 0.72);
    petal(x, y, 4 * tp.k, t * 2 + k, `rgb(${c.join(',')})`, (1 - age / LIFE) * 0.85);
  }

  // soft glow behind the formed butterfly
  const formed = ease(ramp(t, G0 + 1.5, G0 + 3)) * (1 - ramp(t, BURST, BURST + 1));
  if (formed > 0) {
    const ctr = project(0, 0, 1, P);
    const glow = g.createRadialGradient(ctr.x, ctr.y, 0, ctr.x, ctr.y, 260 * ctr.k);
    glow.addColorStop(0, `rgba(255,220,240,${0.22 * formed})`); glow.addColorStop(1, 'rgba(255,220,240,0)');
    g.globalAlpha = 1; g.fillStyle = glow; g.fillRect(SX, SY, SW, SH);
  }

  // every piece: leaves the world, swirls, gathers into the butterfly, then scatters at the end
  const bc = project(0, 0, 1, PB);
  const items = [];
  for (let j = 0; j < BF.length; j++) {
    const p = BF[j];
    const d = ease(ramp(t, D0 + p.r1 * 0.9, D0 + p.r1 * 0.9 + 1.1));
    const el = Math.max(0, t - D0), ang = el * (0.7 + p.r2 * 0.6);
    const bx = p.ox - C.x, by = p.oy - C.y, shrink = 1 - 0.35 * Math.min(1, el / 3);
    const swx = C.x + (bx * Math.cos(ang) - by * Math.sin(ang)) * shrink;
    const swy = C.y + (bx * Math.sin(ang) + by * Math.cos(ang)) * shrink - 30 * d;
    let x = lerp(p.ox, swx, d), y = lerp(p.oy, swy, d), k = 1, z = 0, alpha = d > 0 ? 1 : 0;
    const gth = ease(ramp(t, G0 + p.r3 * 1.3, G0 + p.r3 * 1.3 + 1.6));
    if (gth > 0) {
      let u = p.u, v = p.v;
      if (p.kind === 'petal') { u += 0.06 * Math.sin(t * 2 + j); v += 0.06 * Math.cos(t * 1.7 + j); }
      let tp = project(u, v, p.side, t < BURST ? P : PB);
      if (t >= BURST) {
        const dt = t - BURST;
        const vx = (tp.x - bc.x) * 1.2 + (p.r1 - 0.5) * 120, vy = (tp.y - bc.y) * 1.2 - 60 + (p.r2 - 0.5) * 80;
        tp = { x: tp.x + vx * dt, y: tp.y + vy * dt + 140 * dt * dt, k: tp.k, z: tp.z };
        alpha = 1 - ramp(t, BURST + 0.6, BURST + 3.2);
      }
      x = lerp(x, tp.x, gth); y = lerp(y, tp.y, gth); k = lerp(1, tp.k, gth); z = tp.z;
    }
    if (alpha <= 0) continue;
    const rgb = p.orgb.map((c, i) => Math.round(lerp(c, p.trgb[i], gth)));
    items.push({ x, y, z, k, rgb, alpha, gth, p, rot: t * (p.kind === 'petal' ? 2 : 0.3) + j });
  }
  items.sort((a, b) => b.z - a.z); // far pieces first
  for (const it of items) {
    if (it.p.kind === 'bloom' && it.gth > 0.5) blossom(it.x, it.y, lerp(3, 9 * it.p.size, it.gth) * it.k, it.rot, it.rgb, it.alpha);
    else petal(it.x, it.y, 3.6 * it.k, it.rot, `rgb(${it.rgb.join(',')})`, it.alpha);
  }
  g.globalAlpha = 1;
  g.restore();
}

// meters on the screen: one bar per element + the shared hold bar
function drawMeters(L, hold, t, hidden) {
  if (hidden) return;
  const x0 = SX + SW - 250, y0 = SY + 14;
  g.fillStyle = 'rgba(10,12,16,0.85)'; g.beginPath(); g.roundRect(x0, y0, 236, 150, 10); g.fill();
  g.font = `600 11px ${SANS}`; g.textAlign = 'left';
  ROLES.forEach((r, i) => {
    const y = y0 + 16 + i * 24, bx = x0 + 64, bw = 150;
    const inBand = L[i] >= BAND[0] && L[i] <= BAND[1];
    g.fillStyle = r.color; g.fillText(r.name, x0 + 12, y + 9);
    g.fillStyle = 'rgba(255,255,255,0.15)'; g.fillRect(bx, y, bw, 11);
    g.fillStyle = 'rgba(120,255,150,0.35)'; g.fillRect(bx + BAND[0] * bw, y, (BAND[1] - BAND[0]) * bw, 11);
    g.fillStyle = inBand ? '#9dffb0' : L[i] > BAND[1] ? '#ff8a50' : '#ffffff';
    g.fillRect(bx + clamp(L[i]) * bw - 2, y - 3, 4, 17);
  });
  const hy = y0 + 130, hw = 212;
  g.fillStyle = 'rgba(255,255,255,0.15)'; g.fillRect(x0 + 12, hy, hw, 10);
  g.fillStyle = '#f2c14e'; g.fillRect(x0 + 12, hy, hw * (hold / HOLD_NEEDED), 10);
  g.fillStyle = '#e8e4da'; g.font = `11px ${SANS}`;
  g.fillText(`Balance held together: ${hold.toFixed(1)} / ${HOLD_NEEDED} s`, x0 + 12, hy - 4);
}

// ---------- floor: dots, machines, people ----------
function drawFloor(t, reveal) {
  const fl = g.createLinearGradient(0, 430, 0, H);
  fl.addColorStop(0, '#1a1c22'); fl.addColorStop(1, '#262a31');
  g.fillStyle = fl; g.fillRect(0, 430, W, H - 430);
  if (SCENE_H > 0.05) { // the screen's glow spills onto the floor
    const sp = g.createRadialGradient(W / 2, 430, 0, W / 2, 430, 620);
    sp.addColorStop(0, `rgba(110,90,255,${0.22 * SCENE_H})`); sp.addColorStop(1, 'rgba(110,90,255,0)');
    g.fillStyle = sp; g.fillRect(0, 430, W, H - 430);
  }

  // optional 5th dot
  g.save(); g.setLineDash([6, 6]); g.strokeStyle = 'rgba(232,228,218,0.35)'; g.lineWidth = 2;
  g.beginPath(); g.ellipse(1110, DOT_Y, 52, 16, 0, 0, TAU); g.stroke(); g.restore();
  g.fillStyle = 'rgba(232,228,218,0.5)'; g.font = `12px ${SANS}`; g.textAlign = 'center';
  g.fillText('5th role (optional):', 1110, DOT_Y + 36); g.fillText('Light-catcher', 1110, DOT_Y + 51);

  ROLES.forEach((r, i) => {
    const on = onDot(i, t), off = at(simOff[i], t), ph = at(simPh[i], t), s = speed(i, t);
    // dot
    if (on) {
      const gl = g.createRadialGradient(r.x, DOT_Y, 0, r.x, DOT_Y, 70);
      gl.addColorStop(0, r.color + 'aa'); gl.addColorStop(1, r.color + '00');
      g.fillStyle = gl; g.beginPath(); g.ellipse(r.x, DOT_Y, 75, 26, 0, 0, TAU); g.fill();
      g.fillStyle = r.color; g.beginPath(); g.ellipse(r.x, DOT_Y, 52, 16, 0, 0, TAU); g.fill();
    } else if (arrived(i, t) && off < GRACE) {
      const blink = 0.5 + 0.5 * Math.sin(t * 14);
      g.strokeStyle = `rgba(255,190,60,${0.4 + 0.6 * blink})`; g.lineWidth = 4;
      g.beginPath(); g.ellipse(r.x, DOT_Y, 52, 16, 0, 0, TAU); g.stroke();
      g.fillStyle = '#ffbe3c'; g.font = `600 12px ${SANS}`; g.textAlign = 'center';
      g.fillText(`grace ${Math.ceil(GRACE - off)}…`, r.x, DOT_Y + 5);
    } else if (arrived(i, t)) {
      g.strokeStyle = 'rgba(255,90,70,0.8)'; g.lineWidth = 3;
      g.beginPath(); g.ellipse(r.x, DOT_Y, 52, 16, 0, 0, TAU); g.stroke();
      g.fillStyle = '#ff6b55'; g.font = `600 12px ${SANS}`; g.textAlign = 'center';
      g.fillText('empty: fading', r.x, DOT_Y + 5);
    } else {
      const p = (t * 0.8) % 1;
      g.strokeStyle = 'rgba(232,228,218,0.45)'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(r.x, DOT_Y, 52, 16, 0, 0, TAU); g.stroke();
      g.strokeStyle = `rgba(232,228,218,${0.5 * (1 - p)})`;
      g.beginPath(); g.ellipse(r.x, DOT_Y, 52 + p * 30, 16 + p * 9, 0, 0, TAU); g.stroke();
      g.fillStyle = 'rgba(232,228,218,0.6)'; g.font = `12px ${SANS}`; g.textAlign = 'center';
      g.fillText('step here', r.x, DOT_Y + 5);
    }
    // labels
    g.fillStyle = r.color; g.font = `700 13px ${SANS}`; g.textAlign = 'center';
    g.fillText(r.name, r.x + 40, 697);
    g.fillStyle = 'rgba(232,228,218,0.7)'; g.font = `11px ${SANS}`;
    g.fillText(r.action, r.x + 40, 712);
    // machine
    const hand = drawMachine(i, r, ph, s, t, reveal);
    // person
    const pos = personPos(i, t);
    if (pos) drawPerson(i, r, pos, hand, ph, s, t);
  });
}

function drawMachine(i, r, ph, s, t, reveal) {
  const mx = r.x + 95;
  if (reveal) {
    const gl = g.createRadialGradient(mx, 590, 0, mx, 590, 80);
    gl.addColorStop(0, r.color + '88'); gl.addColorStop(1, r.color + '00');
    g.fillStyle = gl; g.beginPath(); g.arc(mx, 590, 80, 0, TAU); g.fill();
  }
  g.lineCap = 'round';
  if (i === 0) { // sun crank wheel
    g.fillStyle = '#4a4033'; g.fillRect(mx - 5, 575, 10, 85);
    g.strokeStyle = r.color; g.lineWidth = 5; g.beginPath(); g.arc(mx, 575, 32, 0, TAU); g.stroke();
    g.lineWidth = 3;
    for (let k = 0; k < 6; k++) { const a = ph + (k / 6) * TAU; g.beginPath(); g.moveTo(mx, 575); g.lineTo(mx + Math.cos(a) * 32, 575 + Math.sin(a) * 32); g.stroke(); }
    const hx = mx + Math.cos(ph) * 32, hy = 575 + Math.sin(ph) * 32;
    g.fillStyle = '#fff3c4'; g.beginPath(); g.arc(hx, hy, 6, 0, TAU); g.fill();
    return { x: hx, y: hy };
  }
  if (i === 1) { // hand pump lever
    g.fillStyle = '#3c4a57'; g.fillRect(mx - 9, 565, 18, 95);
    g.fillRect(mx + 9, 585, 22, 8);
    if (s > 0 && Math.sin(ph) > 0.3) { g.fillStyle = r.color; g.beginPath(); g.arc(mx + 28, 600 + ((t * 120) % 30), 3, 0, TAU); g.fill(); }
    const a = 0.45 * Math.sin(ph);
    const ex = mx - Math.cos(a) * 60, ey = 565 - Math.sin(a) * 60;
    g.strokeStyle = r.color; g.lineWidth = 6; g.beginPath(); g.moveTo(mx, 565); g.lineTo(ex, ey); g.stroke();
    return { x: ex, y: ey };
  }
  if (i === 2) { // bellows
    const open = 14 + 14 * (1 + Math.sin(ph)) / 2;
    g.fillStyle = '#4a3a30'; g.fillRect(mx - 34, 630, 68, 10);
    g.fillStyle = r.color; g.beginPath();
    g.moveTo(mx - 34, 630); g.lineTo(mx + 34, 630); g.lineTo(mx + 34, 630 - open); g.lineTo(mx - 34, 630 - open * 0.6); g.closePath(); g.fill();
    g.fillStyle = '#4a3a30'; g.save(); g.translate(mx - 34, 630 - open * 0.6); g.rotate(-Math.atan2(open * 0.4, 68)); g.fillRect(0, -6, 74, 8); g.restore();
    if (s > 0) { g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 2; for (let k = 0; k < 3; k++) { const o = ((t * 2 + k / 3) % 1) * 30; g.beginPath(); g.moveTo(mx + 40 + o, 622 - k * 5); g.lineTo(mx + 52 + o, 622 - k * 5); g.stroke(); } }
    return { x: mx + 10, y: 630 - open * 0.8 };
  }
  // roots drum pad on the floor
  const hit = Math.max(0, Math.sin(ph)) ** 6;
  g.fillStyle = '#3a3226'; g.beginPath(); g.ellipse(mx, 655, 38, 12, 0, 0, TAU); g.fill();
  g.strokeStyle = r.color; g.lineWidth = 3; g.beginPath(); g.ellipse(mx, 652, 38, 12, 0, 0, TAU); g.stroke();
  if (s > 0) { g.strokeStyle = `rgba(139,195,74,${hit})`; g.beginPath(); g.ellipse(mx, 652, 38 + 20 * hit, 12 + 7 * hit, 0, 0, TAU); g.stroke(); }
  return null;
}

function drawPerson(i, r, pos, hand, ph, s, t) {
  const bob = s > 0 ? Math.abs(Math.sin(ph)) * 3 : Math.abs(Math.sin(t * 6)) * 2;
  const x = pos.x, y = pos.y - bob;
  // shadow
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(pos.x, pos.y + 2, 24, 7, 0, 0, TAU); g.fill();
  // legs
  g.strokeStyle = '#2a2d36'; g.lineWidth = 9; g.lineCap = 'round';
  const step = i === 3 && s > 0 ? Math.max(0, Math.sin(ph)) * 16 : 0;
  g.beginPath(); g.moveTo(x - 8, y - 40); g.lineTo(x - 8, y - 2); g.stroke();
  g.beginPath(); g.moveTo(x + 8, y - 40); g.lineTo(x + 8 + step * 0.8, y - 2 - step); g.stroke();
  // body (seen from behind)
  g.fillStyle = mix(r.rgb, [40, 40, 50], 0.35);
  g.beginPath(); g.roundRect(x - 20, y - 98, 40, 62, 14); g.fill();
  // arm to the machine handle
  const sx = x + 14, sy = y - 86;
  g.strokeStyle = '#e0b894'; g.lineWidth = 7;
  g.beginPath(); g.moveTo(sx, sy);
  if (hand && onDot(i, t)) g.lineTo(hand.x, hand.y); else g.lineTo(sx + 10, sy + 34);
  g.stroke();
  g.beginPath(); g.moveTo(x - 14, sy); g.lineTo(x - 22, sy + 34); g.stroke();
  // head
  g.fillStyle = '#3b2f2a'; g.beginPath(); g.arc(x, y - 114, 16, 0, TAU); g.fill();
}

function drawBubbles(t) {
  BUBBLES.forEach(([a, b, i, text]) => {
    if (t < a || t > b) return;
    const pos = personPos(i, t); if (!pos) return;
    const k = ease(ramp(t, a, a + 0.25)) * (1 - ease(ramp(t, b - 0.25, b)));
    g.save(); g.globalAlpha = k; g.font = `600 15px ${SANS}`;
    const w = g.measureText(text).width + 22, bx = clamp(pos.x - w / 2, 10, W - w - 10), by = pos.y - 168;
    g.fillStyle = '#fffaf0'; g.beginPath(); g.roundRect(bx, by, w, 30, 12); g.fill();
    g.beginPath(); g.moveTo(pos.x - 6, by + 30); g.lineTo(pos.x + 4, by + 30); g.lineTo(pos.x, by + 40); g.fill();
    g.fillStyle = '#1b1d22'; g.textAlign = 'left'; g.fillText(text, bx + 11, by + 20);
    g.restore();
  });
}

function drawCaption(t) {
  let cap = CAPTIONS[0][1], start = 0;
  CAPTIONS.forEach(([s, c]) => { if (t >= s) { cap = c; start = s; } });
  const k = ease(ramp(t, start, start + 0.4));
  g.save(); g.globalAlpha = k; g.fillStyle = '#e8e4da'; g.font = `500 19px ${SANS}`; g.textAlign = 'center';
  g.fillText(cap, W / 2, 451); g.restore();
}

function drawTitle(t) {
  g.fillStyle = 'rgba(232,228,218,0.75)'; g.font = `600 13px ${SANS}`; g.textAlign = 'left';
  g.fillText('MetamorphUs · Option 2: The Ecosystem Engine · with the dot lock', 18, 30);
  g.textAlign = 'right'; g.fillStyle = 'rgba(232,228,218,0.45)'; g.font = `12px ${SANS}`;
  g.fillText('Illustrative mockup, not a working prototype', W - 18, 30);
}

function drawEndCard(t) {
  const k = ease(ramp(t, END_CARD, END_CARD + 1));
  if (k <= 0) return;
  g.fillStyle = `rgba(12,13,16,${0.88 * k})`; g.fillRect(0, 0, W, H);
  g.save(); g.globalAlpha = k; g.textAlign = 'center'; g.fillStyle = '#f2c14e';
  g.font = `700 54px ${SANS}`; g.fillText('MetamorphUs', W / 2, 300);
  g.fillStyle = '#e8e4da'; g.font = `400 24px ${SANS}`;
  g.fillText('Option 2: The Ecosystem Engine, with the dot lock', W / 2, 350);
  g.fillStyle = '#9aa0aa'; g.font = `16px ${SANS}`;
  g.fillText('Four strangers, four machines, one world. Nobody can run two.', W / 2, 395);
  g.fillText('Illustrative mockup, not a working prototype · Nov 11, 2026', W / 2, 425);
  g.restore();
}

// ?clean=1 hides the title, meters, captions and speech bubbles (for stills and renderings)
const CLEAN = new URLSearchParams(location.search).has('clean');
function render(t) {
  const L = ROLES.map((_, i) => at(simL[i], t));
  const hold = at(simHold, t);
  const glowOn = t >= REVEAL && t < BURST + 1.5;
  const boost = ease(ramp(t, REVEAL, REVEAL + 1)) * (1 - ease(ramp(t, BURST + 1, BURST + 4)));
  const bloom = t < REVEAL ? 0 : ease(ramp(t, REVEAL, REVEAL + 1.5)) * (1 - ease(ramp(t, BURST, BURST + 2)));
  let health = L.reduce((s, v) => s + (1 - Math.min(1, Math.abs(v - 0.6) / 0.6)), 0) / 4;
  const scorch = clamp((L[0] - 0.75) / 0.25);
  health = Math.max(health * (1 - 0.5 * scorch), lerp(health, 1, boost));
  g.fillStyle = '#111317'; g.fillRect(0, 0, W, H);
  if (!CLEAN) drawTitle(t);
  SCENE_H = health;
  drawScreen(t, L, health, scorch, bloom);
  const dark = ease(ramp(t, D0 + 0.2, D0 + 2.2)) * (1 - ease(ramp(t, BURST + 1, BURST + 3)));
  if (dark > 0) { g.fillStyle = `rgba(6,7,12,${0.94 * dark})`; g.fillRect(SX, SY, SW, SH); }
  drawEnding(t);
  drawMeters(L, hold, t, CLEAN || t >= REVEAL);
  drawFloor(t, glowOn);
  if (!CLEAN) { drawCaption(t); drawBubbles(t); }
  drawEndCard(t);
}

// ---------- player ----------
let t0 = performance.now(), offset = 0, playing = true, recording = null;
const params = new URLSearchParams(location.search);
if (params.has('t')) { offset = clamp(Number(params.get('t')) || 0, 0, T); playing = false; }
const now = () => (playing ? offset + (performance.now() - t0) / 1000 : offset);
function setTime(x) { offset = clamp(x, 0, T); t0 = performance.now(); }
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

const chap = $('chap');
CHAPTERS.forEach(([s, name]) => {
  const b = document.createElement('button'); b.textContent = name;
  b.onclick = () => { setTime(s); if (!playing) render(offset); };
  chap.appendChild(b);
});
$('play').onclick = () => { if (playing) { offset = now(); playing = false; } else { t0 = performance.now(); playing = true; } $('play').textContent = playing ? 'Pause' : 'Play'; };
$('play').textContent = playing ? 'Pause' : 'Play';
$('scrub').oninput = (e) => { setTime((e.target.value / 1000) * T); if (!playing) render(offset); };
$('rec').onclick = () => {
  if (recording) return;
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = types.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!type) { alert('Recording is not supported in this browser. Try Chrome.'); return; }
  const rec = new MediaRecorder(cv.captureStream(30), { mimeType: type, videoBitsPerSecond: 8e6 });
  const chunks = [];
  rec.ondataavailable = (e) => chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = `ecosystem-engine-dot-lock.${type.includes('mp4') ? 'mp4' : 'webm'}`;
    a.click(); recording = null; $('rec').textContent = 'Record video';
  };
  recording = rec; setTime(0); playing = true; $('play').textContent = 'Pause';
  $('rec').textContent = 'Recording…'; rec.start();
};

function frame() {
  let t = now();
  if (t >= T) {
    if (recording) { recording.stop(); playing = false; offset = T; t = T; }
    else { setTime(0); t = 0; }
  }
  render(t);
  $('scrub').value = Math.round((t / T) * 1000);
  $('time').textContent = `${fmt(t)} / ${fmt(T)}`;
  [...chap.children].forEach((b, k) => b.classList.toggle('cur', t >= CHAPTERS[k][0] && (k === CHAPTERS.length - 1 || t < CHAPTERS[k + 1][0])));
  requestAnimationFrame(frame);
}
render(now());
requestAnimationFrame(frame);
</script>
