<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Living Ecosystem: matching controllers reel</title>
<!--
  Video reel of the "matching controllers, one element each" variations (Nov 9, 2026).
  Illustrative mockup, not a working prototype. Single file, no dependencies.
  - Plays as a ~2.5 min reel, one scene per variation. Chapter buttons jump to a scene.
  - "Record video" saves one full play as a video file (MP4 in recent Chrome, otherwise WebM).
  - URL options: ?t=40 (jump to 40 s, paused)   ?scene=8&u=3 (scene 8, 3 s in, paused)
-->
<style>
  html,body{margin:0;background:#111317;color:#e8e4da;font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif}
  #wrap{width:min(1280px,calc(100vw - 32px),calc((100vh - 190px)*16/9));margin:14px auto}
  canvas{width:100%;display:block;border-radius:8px;background:#000}
  .bar{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
  button{background:#262a33;color:#e8e4da;border:1px solid #3a3f4b;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
  button:hover{background:#30353f}
  #scrub{flex:1;min-width:200px;accent-color:#f2c14e}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;color:#9aa0aa}
  .chapters{display:flex;flex-wrap:wrap;gap:6px}
  .chapters button{font-size:12px;padding:3px 8px}
  .chapters button.cur{border-color:#f2c14e;color:#f2c14e}
  .hint{color:#8b909a;font-size:12.5px;margin:8px 0 0}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="bar">
    <button id="play">Pause</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Timeline">
    <span id="time" class="mono">0:00</span>
    <button id="rec">Record video</button>
  </div>
  <div class="chapters" id="chap"></div>
  <p class="hint" id="hint">Illustrative mockup of controller ideas for The Living Ecosystem. Every variation is an idea to test, not a decision.</p>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const W = 1280, H = 720, cv = $('c'), g = cv.getContext('2d');
cv.width = W; cv.height = H;
const TAU = Math.PI * 2, PI = Math.PI;
const SERIF = 'Georgia, "Iowan Old Style", "Times New Roman", serif';
const MONO = '"SF Mono", Menlo, Consolas, monospace';
const SANS = '-apple-system, "Helvetica Neue", Arial, sans-serif';

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mixC = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
const gauss = (u, c, w) => Math.exp(-Math.pow((u - c) / w, 2));

const EL = { sun: hex('#f2c14e'), water: hex('#5fb3e8'), seeds: hex('#ec8fbf'), wind: hex('#a8e0cc'), night: hex('#8f7cf0') };
const ELS = ['sun', 'water', 'seeds'];
const GREY = [170, 175, 185], RED = hex('#e8785f'), GREEN = hex('#7fd48b');
const SX = 290, SY = 124, SW = 700, SH = 284, GY = SY + Math.round(SH * 0.64);
const TH = [SX + SW / 6, SX + SW / 2, SX + SW * 5 / 6];
const PX = [400, 640, 880];
const SK = '#0c0d11';
const FC = ['#f28cb1', '#f6b3c8', '#ffd166', '#f79d65', '#c99be8', '#ffffff', '#ff7aa2', '#9ad0f5'].map(hex);

/* ---------- the little world on the screen ---------- */
const R = rng(42);
const GRASS = Array.from({ length: 200 }, () => ({ xr: R(), yr: 0.66 + R() * 0.33, h: 6 + R() * 10, th: R() * 0.85, ph: R() * 6.28 }));
const FLW = Array.from({ length: 70 }, () => ({ xr: 0.02 + R() * 0.96, yr: 0.7 + R() * 0.27, h: 10 + R() * 16, r: 3 + R() * 3.5, th: 0.1 + R() * 0.85,
  c: FC[(R() * FC.length) | 0], ph: R() * 6.28, rot: R() * 6.28 })).sort((a, b) => a.yr - b.yr);
const CRK = Array.from({ length: 22 }, () => {
  let x = SX + R() * SW, y = GY + 8 + R() * (SY + SH - GY - 14), a = R() * 6.28; const p = [[x, y]];
  for (let k = 0; k < 4; k++) { a += R() * 1.6 - 0.8; x += Math.cos(a) * 14; y += Math.sin(a) * 5; p.push([x, y]); }
  return p;
});

function world(gv, o = {}) {
  const G = typeof gv === 'function' ? gv : () => gv;
  const ga = o.avg ?? (typeof gv === 'function' ? 0.15 : gv), dk = o.dark || 0, t = o.t || 0, wind = o.wind || 0, glow = o.glow || 0;
  let top = mixC(hex('#8c867c'), hex('#5d9fd3'), ga), bot = mixC(hex('#cdbd9f'), hex('#d4ecf2'), ga);
  top = mixC(top, hex('#0f0d2a'), dk); bot = mixC(bot, hex('#3a2a5c'), dk);
  let gr = g.createLinearGradient(0, SY, 0, GY);
  gr.addColorStop(0, rgba(top)); gr.addColorStop(1, rgba(bot));
  g.fillStyle = gr; g.fillRect(SX, SY, SW, GY - SY + 2);
  if (dk > 0.3) for (let i = 0; i < 40; i++) {
    g.fillStyle = `rgba(255,245,230,${(dk - 0.3) * (0.5 + 0.5 * Math.sin(t * 2 + i))})`;
    g.beginPath(); g.arc(SX + ((i * 137) % SW), SY + ((i * 71) % (GY - SY - 30)), 1.2, 0, TAU); g.fill();
  }
  g.fillStyle = rgba(mixC(mixC(hex('#9a8a72'), hex('#7fae8a'), ga), hex('#1c1838'), dk * 0.8));
  g.beginPath(); g.moveTo(SX, GY + 2);
  for (let x = 0; x <= SW; x += 14) g.lineTo(SX + x, GY - 20 - 12 * Math.sin(x * 0.011 + 1) - 7 * Math.sin(x * 0.029));
  g.lineTo(SX + SW, GY + 2); g.closePath(); g.fill();
  const gc = mixC(mixC(hex('#a88a5e'), hex('#6b9b49'), ga), hex('#1d1a33'), dk * 0.75);
  gr = g.createLinearGradient(0, GY, 0, SY + SH);
  gr.addColorStop(0, rgba(gc)); gr.addColorStop(1, rgba(mixC(gc, [0, 0, 0], 0.3)));
  g.fillStyle = gr; g.fillRect(SX, GY, SW, SY + SH - GY);
  const ca = (1 - ga) * 0.5;
  if (ca > 0.02) {
    g.strokeStyle = `rgba(70,48,28,${ca})`; g.lineWidth = 1; g.beginPath();
    for (const p of CRK) { g.moveTo(p[0][0], p[0][1]); for (const q of p) g.lineTo(q[0], q[1]); }
    g.stroke();
  }
  g.strokeStyle = rgba(mixC(hex('#5f9e45'), hex('#2a3a30'), dk * 0.6)); g.lineWidth = 1.3; g.beginPath();
  for (const b of GRASS) {
    const v = smooth(b.th, b.th + 0.12, G(b.xr, b.yr)); if (v <= 0) continue;
    const x = SX + b.xr * SW, y = SY + b.yr * SH, h = b.h * v;
    const sw = Math.sin(t * 2 + b.ph) * 1.5 + wind * 7 * (0.6 + 0.4 * Math.sin(t * 5 + b.ph));
    g.moveTo(x, y); g.quadraticCurveTo(x, y - h * 0.6, x + sw, y - h);
  }
  g.stroke();
  for (const f of FLW) {
    const v = smooth(f.th, f.th + 0.12, G(f.xr, f.yr)); if (v <= 0.01) continue;
    const x = SX + f.xr * SW, y = SY + f.yr * SH, h = f.h * v;
    const sw = Math.sin(t * 1.6 + f.ph) * 1.5 + wind * 6 * (0.6 + 0.4 * Math.sin(t * 5 + f.ph));
    const tx = x + sw, ty = y - h;
    g.strokeStyle = rgba(mixC(hex('#5f9e45'), hex('#2a3a30'), dk * 0.6)); g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x, y - h * 0.6, tx, ty); g.stroke();
    const r = f.r * v, col = mixC(f.c, [20, 18, 40], dk * 0.45);
    if (glow > 0.01) {
      g.save(); g.globalCompositeOperation = 'lighter';
      const gg = g.createRadialGradient(tx, ty, 0, tx, ty, r * 4 + 1);
      gg.addColorStop(0, rgba(f.c, 0.6 * glow)); gg.addColorStop(1, rgba(f.c, 0));
      g.fillStyle = gg; g.fillRect(tx - r * 4 - 1, ty - r * 4 - 1, r * 8 + 2, r * 8 + 2); g.restore();
    }
    g.fillStyle = rgba(col);
    for (let k = 0; k < 5; k++) { const a = f.rot + k * TAU / 5; g.beginPath(); g.ellipse(tx + Math.cos(a) * r * 0.6, ty + Math.sin(a) * r * 0.6, r * 0.6, r * 0.35, a, 0, TAU); g.fill(); }
    g.fillStyle = '#ffe08a'; g.beginPath(); g.arc(tx, ty, r * 0.3, 0, TAU); g.fill();
  }
}
function screen(fn) {
  g.save(); rrect(SX, SY, SW, SH, 10); g.clip(); fn(); g.restore();
  g.strokeStyle = '#2c3038'; g.lineWidth = 8; rrect(SX - 4, SY - 4, SW + 8, SH + 8, 13); g.stroke();
}

/* ---------- effects on the screen ---------- */
function sunGlow(x, y, r, a, t) {
  if (a <= 0.01) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(x, y, 2, x, y, r * 2.4);
  gr.addColorStop(0, `rgba(255,226,140,${0.75 * a})`); gr.addColorStop(1, 'rgba(255,226,140,0)');
  g.fillStyle = gr; g.fillRect(x - r * 2.4, y - r * 2.4, r * 4.8, r * 4.8); g.restore();
  g.strokeStyle = `rgba(255,214,110,${0.85 * a})`; g.lineWidth = 2.5;
  for (let k = 0; k < 10; k++) { const an = k * TAU / 10 + t * 0.4; g.beginPath(); g.moveTo(x + Math.cos(an) * r * 0.72, y + Math.sin(an) * r * 0.72); g.lineTo(x + Math.cos(an) * r * 1.05, y + Math.sin(an) * r * 1.05); g.stroke(); }
  g.fillStyle = `rgba(255,232,150,${a})`; g.beginPath(); g.arc(x, y, r * 0.48, 0, TAU); g.fill();
}
function sunBeam(x, a, t) {
  if (a <= 0.01) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createLinearGradient(0, SY, 0, GY + 30);
  gr.addColorStop(0, `rgba(255,226,140,${0.05 * a})`); gr.addColorStop(1, `rgba(255,226,140,${0.42 * a})`);
  g.fillStyle = gr; g.beginPath(); g.moveTo(x - 18, SY); g.lineTo(x + 18, SY); g.lineTo(x + 58, GY + 30); g.lineTo(x - 58, GY + 30); g.closePath(); g.fill();
  g.fillStyle = `rgba(255,226,140,${0.35 * a})`; g.beginPath(); g.ellipse(x, GY + 30, 66, 12, 0, 0, TAU); g.fill();
  g.restore();
  sunGlow(x, SY + 26, 18, a, t);
}
function cloud(x, y, s, a) {
  g.fillStyle = `rgba(140,160,182,${0.92 * a})`; g.beginPath();
  g.arc(x, y, 16 * s, 0, TAU); g.arc(x + 18 * s, y + 4 * s, 13 * s, 0, TAU); g.arc(x - 18 * s, y + 5 * s, 12 * s, 0, TAU); g.arc(x + 4 * s, y - 9 * s, 12 * s, 0, TAU);
  g.fill();
}
function rainAt(x, a, t, w = 110) {
  if (a <= 0.01) return;
  cloud(x, SY + 38, 1.6, a);
  g.strokeStyle = `rgba(205,232,255,${0.8 * a})`; g.lineWidth = 1.4; g.beginPath();
  const top = SY + 56, span = GY + 32 - top;
  for (let i = 0; i < 30; i++) { const xx = x - w / 2 + ((i * 37.7) % w), yy = top + ((i * 53.3 + t * 360) % span); g.moveTo(xx, yy); g.lineTo(xx - 2, yy + 9); }
  g.stroke();
}
function seedsAt(x, a, t, w = 100) {
  if (a <= 0.01) return;
  g.fillStyle = `rgba(255,186,218,${a})`;
  const top = SY + 14, span = GY + 30 - top;
  for (let i = 0; i < 22; i++) {
    const xx = x - w / 2 + ((i * 29.3) % w) + Math.sin(t * 2 + i) * 4, yy = top + ((i * 61.7 + t * 110) % span);
    g.beginPath(); g.ellipse(xx, yy, 3.2, 2.1, t * 3 + i, 0, TAU); g.fill();
  }
}
function scorchAt(x, a) {
  if (a <= 0.01) return;
  g.fillStyle = `rgba(95,58,25,${0.65 * a})`; g.beginPath(); g.ellipse(x, GY + 34, 70, 14, 0, 0, TAU); g.fill();
  g.strokeStyle = `rgba(45,26,10,${0.75 * a})`; g.lineWidth = 1.3; g.beginPath();
  for (let k = 0; k < 6; k++) { const xx = x - 50 + k * 20; g.moveTo(xx, GY + 27); g.lineTo(xx + 8, GY + 35); g.lineTo(xx + 3, GY + 42); }
  g.stroke();
}
function windFx(a, t) {
  if (a <= 0.01) return;
  g.strokeStyle = `rgba(225,248,240,${0.7 * a})`; g.lineWidth = 2;
  for (let i = 0; i < 7; i++) {
    const y = SY + 40 + i * 30, x0 = SX + ((i * 173 + t * 260) % (SW + 200)) - 100;
    g.beginPath(); g.moveTo(x0, y); g.bezierCurveTo(x0 + 40, y - 10, x0 + 80, y + 10, x0 + 130, y); g.stroke();
  }
}
function effect(el, x, a, t) {
  if (el === 'sun') sunGlow(x, SY + 70, 34, a, t);
  else if (el === 'water') rainAt(x, a, t);
  else if (el === 'seeds') seedsAt(x, a, t);
}
function bfly(x, y, s, flap, a) {
  if (a <= 0.01) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  let gr = g.createRadialGradient(x, y, 4, x, y, 130 * s);
  gr.addColorStop(0, `rgba(255,160,220,${0.45 * a})`); gr.addColorStop(1, 'rgba(255,160,220,0)');
  g.fillStyle = gr; g.fillRect(x - 130 * s, y - 130 * s, 260 * s, 260 * s); g.restore();
  for (const sd of [-1, 1]) {
    g.save(); g.translate(x, y); g.scale(sd * s * Math.cos(flap), s); g.globalAlpha = a;
    gr = g.createRadialGradient(0, 0, 4, 0, 0, 82);
    gr.addColorStop(0, '#fff0b0'); gr.addColorStop(0.45, '#ffb36b'); gr.addColorStop(0.8, '#ff6fa8'); gr.addColorStop(1, '#8a6cff');
    g.fillStyle = gr; g.beginPath(); g.ellipse(38, -26, 40, 28, -0.55, 0, TAU); g.fill();
    gr = g.createRadialGradient(0, 0, 4, 0, 0, 60);
    gr.addColorStop(0, '#ffe4a0'); gr.addColorStop(0.5, '#ff8f7a'); gr.addColorStop(1, '#5fd4ff');
    g.fillStyle = gr; g.beginPath(); g.ellipse(26, 22, 25, 20, 0.5, 0, TAU); g.fill();
    g.restore();
  }
  g.save(); g.globalAlpha = a; g.fillStyle = '#4a2a7a'; g.beginPath(); g.ellipse(x, y, 4 * s, 28 * s, 0, 0, TAU); g.fill(); g.restore();
}

/* ---------- people and controllers (in the room, seen from behind) ---------- */
function body(px, rim, sc = 1, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.translate(px, H); g.scale(sc, sc);
  g.fillStyle = SK;
  g.beginPath(); g.moveTo(-82, 2); g.bezierCurveTo(-80, -60, -50, -72, 0, -74); g.bezierCurveTo(50, -72, 80, -60, 82, 2); g.fill();
  g.beginPath(); g.ellipse(0, -108, 27, 32, 0, 0, TAU); g.fill();
  {
    g.strokeStyle = rim ? rgba(rim, 0.8) : 'rgba(150,160,182,0.35)'; g.lineWidth = rim ? 2.5 : 1.5;
    g.beginPath(); g.ellipse(0, -108, 27, 32, 0, PI * 1.1, PI * 1.9); g.stroke();
    g.beginPath(); g.moveTo(-70, -46); g.bezierCurveTo(-60, -64, -40, -71, -12, -73); g.stroke();
    g.beginPath(); g.moveTo(70, -46); g.bezierCurveTo(60, -64, 40, -71, 12, -73); g.stroke();
  }
  g.restore();
}
function arm(px, hx, hy, sc = 1, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.strokeStyle = SK; g.lineCap = 'round'; g.lineWidth = 16 * sc;
  const sx = px + 44 * sc, sy = H - 58 * sc;
  g.beginPath(); g.moveTo(sx, sy); g.quadraticCurveTo(sx + (hx - sx) * 0.2 + 10 * sc, sy - (sy - hy) * 0.6, hx, hy + 24); g.stroke();
  g.restore();
}
function hand(hx, hy, sc = 1) { g.fillStyle = SK; g.beginPath(); g.ellipse(hx, hy + 24, 11 * sc, 9 * sc, 0, 0, TAU); g.fill(); }

function ctrl(type, x, y, o = {}) {
  const rot = o.rot || 0, s = o.s || 1, core = o.core || null, glow = o.glow || 0, open = o.open || 0;
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  if (core && glow > 0.01) {
    const gr = g.createRadialGradient(0, 0, 4, 0, 0, 72);
    gr.addColorStop(0, rgba(core, 0.55 * glow)); gr.addColorStop(1, rgba(core, 0));
    g.fillStyle = gr; g.fillRect(-72, -72, 144, 144);
  }
  const coreFill = core ? rgba(mixC(hex('#3a2a1c'), core, 0.2 + 0.8 * glow)) : '#3a2a1c';
  const wood = (x0, y0, x1, y1) => { const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, '#d6a86c'); gr.addColorStop(1, '#7c5631'); return gr; };
  if (type === 'pod' || type === 'empty') {
    g.fillStyle = wood(-22, -30, 22, 30); g.beginPath(); g.ellipse(0, 0, 22, 30, 0, 0, TAU); g.fill();
    g.strokeStyle = '#4f3620'; g.lineWidth = 1.5; g.stroke();
    g.strokeStyle = 'rgba(70,45,25,0.55)'; g.lineWidth = 1.2;
    for (const d of [-1, 1]) { g.beginPath(); g.moveTo(d * 7, -28); g.quadraticCurveTo(d * 16, 0, d * 7, 28); g.stroke(); }
    if (type === 'empty') {
      g.fillStyle = '#22170e'; g.beginPath(); g.arc(0, -2, 9, 0, TAU); g.fill();
      g.setLineDash([3, 2]); g.strokeStyle = '#d9c2a0'; g.lineWidth = 1.2; g.stroke(); g.setLineDash([]);
    } else {
      g.fillStyle = coreFill; g.beginPath(); g.arc(0, -2, 8, 0, TAU); g.fill();
      if (core && glow > 0.3) { g.fillStyle = `rgba(255,255,255,${0.6 * glow})`; g.beginPath(); g.arc(-2, -4, 3, 0, TAU); g.fill(); }
    }
  } else if (type === 'stone') {
    const gr = g.createLinearGradient(-26, -20, 26, 20); gr.addColorStop(0, '#aab3bc'); gr.addColorStop(1, '#5b636d');
    g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, 27, 20, 0.15, 0, TAU); g.fill();
    g.strokeStyle = '#40464e'; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = core ? rgba(mixC(hex('#3c434b'), core, 0.2 + 0.8 * glow)) : '#3c434b'; g.beginPath(); g.arc(0, 0, 7, 0, TAU); g.fill();
  } else if (type === 'lantern') {
    g.strokeStyle = '#cbb48a'; g.lineWidth = 2; g.beginPath(); g.arc(0, -34, 8, PI, 0); g.stroke();
    g.fillStyle = '#6b5233'; rrect(-15, -34, 30, 7, 2); g.fill();
    g.fillStyle = core ? rgba(mixC([200, 215, 230], core, glow), 0.3 + 0.6 * glow) : 'rgba(200,215,230,0.3)';
    rrect(-16, -27, 32, 38, 5); g.fill(); g.strokeStyle = '#cbb48a'; g.lineWidth = 1.5; g.stroke();
    g.beginPath(); for (const bx of [-8, 0, 8]) { g.moveTo(bx, -27); g.lineTo(bx, 11); } g.stroke();
    if (glow > 0.01) { g.fillStyle = `rgba(255,250,230,${0.85 * glow})`; g.beginPath(); g.ellipse(0, -8, 5, 8, 0, 0, TAU); g.fill(); }
    g.fillStyle = '#6b5233'; rrect(-17, 11, 34, 8, 2); g.fill();
  } else if (type === 'bud') {
    g.strokeStyle = '#4f8a3c'; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, 10); g.quadraticCurveTo(4, 30, 0, 48); g.stroke();
    g.fillStyle = '#5f9e45'; g.beginPath(); g.ellipse(10, 32, 10, 4, -0.5, 0, TAU); g.fill();
    for (let k = 0; k < 5; k++) {
      const ang = (k - 2) * 0.28 * (1 + open * 2.6);
      g.save(); g.translate(0, 6); g.rotate(ang);
      const gr = g.createLinearGradient(0, -40, 0, 0); gr.addColorStop(0, '#ffb3d1'); gr.addColorStop(1, '#d65d92');
      g.fillStyle = gr; g.beginPath(); g.ellipse(0, -20, 8, 21, 0, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(120,30,70,0.4)'; g.lineWidth = 1; g.stroke(); g.restore();
    }
    if (open > 0.05) {
      g.fillStyle = rgba(core || hex('#ffe08a'), open); g.beginPath(); g.arc(0, 0, 7, 0, TAU); g.fill();

$('rec').onclick = () => startRec(false);

if (params.has('t')) { t = clamp(+params.get('t'), 0, LEN - 0.01); playing = false; }
if (params.has('scene')) { t = STARTS[+params.get('scene')] + (+params.get('u') || 1); playing = false; }

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) {
    t += dt;
    if (t >= LEN) { if (rec) { t = LEN - 0.001; playing = false; rec.stop(); } else t %= LEN; }
  }
  const i = render(t);
  window.__frames = (window.__frames || 0) + 1;
  if (i !== curScene) { curScene = i; [...chap.children].forEach((b, k) => b.classList.toggle('cur', k === i)); }
  $('play').textContent = playing ? 'Pause' : 'Play';
  $('scrub').value = Math.round(t / LEN * 1000);
  $('time').textContent = `${fmt(t)} / ${fmt(LEN)}`;
  requestAnimationFrame(frame);
}
window.onerror = (m, src, line) => { document.title = 'ERROR: ' + m + ' @' + line; const p = $('hint'); p.style.color = '#e8785f'; p.textContent = 'Error: ' + m + ' (line ' + line + ')'; };
if (params.get('record') === '1') startRec(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
