<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="node_modules/three/build/three.min.js"></script>
</head><body>
<script>
const P = new URLSearchParams(location.search);
const FORM = P.get('form') || 'flap';   // flap | screen | lightbox
const N = +(P.get('n') || 1);            // group size: 1, 3, 6
const W = 1600, H = 1000;

// ---------- image content (one picture per group size) ----------
const PAL = {sky:'#efe6d2', ground:'#d9c9a3', leaf:'#5f8f4e', leafDark:'#3f6b36', trunk:'#6b4a33', far:'#a9bf8e'};
function leafPath(g, x, y, s, rot, col){
  g.save(); g.translate(x,y); g.rotate(rot); g.scale(s,s);
  g.fillStyle = col; g.beginPath();
  g.moveTo(0,-1); g.bezierCurveTo(0.75,-0.55,0.6,0.55,0,1); g.bezierCurveTo(-0.6,0.55,-0.75,-0.55,0,-1); g.fill();
  g.strokeStyle='rgba(0,0,0,0.25)'; g.lineWidth=0.04; g.beginPath(); g.moveTo(0,-0.9); g.lineTo(0,1.15); g.stroke();
  g.restore();
}
function tree(g, x, base, h, col, trunk){
  g.fillStyle = trunk; g.fillRect(x-h*0.035, base-h*0.45, h*0.07, h*0.45);
  g.fillStyle = col;
  [[0,0.62,0.30],[-0.13,0.5,0.22],[0.13,0.5,0.22],[0,0.82,0.22]].forEach(([dx,dy,r])=>{
    g.beginPath(); g.arc(x+dx*h, base-dy*h, r*h, 0, Math.PI*2); g.fill();
  });
}
function drawImage(kind, w=960, h=600, transparent=false){
  const c = document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d');
  if(!transparent){ g.fillStyle=PAL.sky; g.fillRect(0,0,w,h); g.fillStyle=PAL.ground; g.fillRect(0,h*0.8,w,h*0.2); }
  if(kind==='leaf'){ leafPath(g, w/2, h*0.47, h*0.3, 0.5, PAL.leaf); }
  if(kind==='tree'){ tree(g, w/2, h*0.82, h*0.78, PAL.leaf, PAL.trunk); }
  if(kind==='forest'){
    const rnd = (i)=>((Math.sin(i*91.7)*43758.5)%1+1)%1;
    for(let i=0;i<14;i++) tree(g, w*(0.03+0.07*i)+rnd(i)*30, h*0.8, h*(0.42+rnd(i+5)*0.12), PAL.far, '#8a6c52');
    for(let i=0;i<9;i++) tree(g, w*(0.06+0.11*i)+rnd(i+20)*30, h*0.86, h*(0.6+rnd(i+9)*0.18), PAL.leaf, PAL.trunk);
    for(let i=0;i<5;i++) tree(g, w*(0.1+0.2*i)+rnd(i+40)*40, h*0.95, h*(0.75+rnd(i+3)*0.15), PAL.leafDark, PAL.trunk);
  }
  return c;
}
const KIND = N>=6 ? 'forest' : N>=3 ? 'tree' : 'leaf';

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1c1b1f');
const camera = new THREE.PerspectiveCamera(36, W/H, 0.1, 100);
camera.position.set(-3.0, 2.05, 7.6); camera.lookAt(0.35, 1.25, 0);

scene.add(new THREE.HemisphereLight('#d8d4cc', '#2a2622', 0.55));
const spot = new THREE.SpotLight('#fff1dc', 55, 20, Math.PI/5, 0.6, 1.6);
spot.position.set(1.5, 4.2, 4); spot.target.position.set(0,1.3,0); spot.castShadow = true;
spot.shadow.mapSize.set(2048,2048); scene.add(spot, spot.target);

// room: floor + back wall
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20,20), new THREE.MeshStandardMaterial({color:'#3b3a3e', roughness:0.9}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
const back = new THREE.Mesh(new THREE.PlaneGeometry(20,8), new THREE.MeshStandardMaterial({color:'#4a484e', roughness:1}));
back.position.set(0,4,-0.3); back.receiveShadow = true; scene.add(back);

// display: 3.0 m wide x 1.875 m tall, bottom edge 0.55 m off the floor
const DW = 3.0, DH = 1.875, DY = 0.55 + DH/2;
const img = drawImage(KIND);
const tex = new THREE.CanvasTexture(img); tex.colorSpace = THREE.SRGBColorSpace;

if(FORM==='flap'){
  const cols=16, rows=10, tw=DW/cols, th=DH/rows, gap=0.012;
  const housing = new THREE.Mesh(new THREE.BoxGeometry(DW+0.16, DH+0.16, 0.22), new THREE.MeshStandardMaterial({color:'#121214', roughness:0.6}));
  housing.position.set(0,DY,-0.15); housing.castShadow=true; scene.add(housing);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    for(const half of [0,1]){ // top and bottom flap of each module
      const g = new THREE.PlaneGeometry(tw-gap, th/2-gap*0.6);
      const uv = g.attributes.uv;
      for(let i=0;i<uv.count;i++){
        uv.setXY(i, (c + uv.getX(i)*(1-gap/tw) + gap/tw/2)/cols, (rows-1-r + (half? 0 : 0.5) + uv.getY(i)*0.5)/rows);
      }
      const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({map:tex, roughness:0.45, metalness:0.0}));
      const x = -DW/2 + tw*(c+0.5), y = DY + DH/2 - th*(r+0.5) + (half? -th/4 : th/4);
      m.position.set(x, y, -0.035 + (half?0.004:0)); m.rotation.x = half? 0.035 : 0;
      m.castShadow = true; scene.add(m);
    }
  }
}
if(FORM==='screen'){
  const bezel = new THREE.Mesh(new THREE.BoxGeometry(DW+0.06, DH+0.06, 0.06), new THREE.MeshStandardMaterial({color:'#0b0b0c', roughness:0.35, metalness:0.4}));
  bezel.position.set(0,DY,-0.25); bezel.castShadow=true; scene.add(bezel);
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(DW, DH), new THREE.MeshBasicMaterial({map:tex}));
  panel.position.set(0,DY,-0.218); scene.add(panel);
  const glow = new THREE.PointLight('#f3ead6', 4, 4); glow.position.set(0,DY,0.6); scene.add(glow);
}
if(FORM==='lightbox'){
  const depth = 0.3;
  const wood = new THREE.MeshStandardMaterial({color:'#8a6a4a', roughness:0.7});
  const frame = new THREE.Group();
  const t = 0.07;
  [[0, DH/2+t/2, DW+2*t, t],[0,-DH/2-t/2, DW+2*t, t],[-DW/2-t/2,0,t,DH],[DW/2+t/2,0,t,DH]].forEach(([x,y,w,h])=>{
    const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,depth), wood); b.position.set(x,y,0); b.castShadow=true; frame.add(b);
  });
  frame.position.set(0,DY,-0.3+depth/2); scene.add(frame);
  // backlight panel (always on, warm)
  const bg = drawImage('none'); // plain sky + ground layer
  const bgTex = new THREE.CanvasTexture(bg); bgTex.colorSpace = THREE.SRGBColorSpace;
  const backPanel = new THREE.Mesh(new THREE.PlaneGeometry(DW,DH), new THREE.MeshBasicMaterial({map:bgTex, color:'#fff6e4'}));
  backPanel.position.set(0,DY,-0.28); scene.add(backPanel);
  // three printed layers, lit one by one as the group grows
  const layers = [['forest', N>=6], ['tree', N>=3 && N<6], ['leaf', N<3]];
  layers.forEach(([k,on],i)=>{
    const c = drawImage(k, 960, 600, true);
    const lt = new THREE.CanvasTexture(c); lt.colorSpace = THREE.SRGBColorSpace;
    const mat = new THREE.MeshBasicMaterial({map:lt, transparent:true, opacity: on? 1 : 0.06});
    const p = new THREE.Mesh(new THREE.PlaneGeometry(DW,DH), mat);
    p.position.set(0,DY,-0.24 + i*0.08); scene.add(p);
  });
  // thin acetate sheets visible as faint edges
  for(let i=0;i<3;i++){
    const s = new THREE.Mesh(new THREE.PlaneGeometry(DW,DH), new THREE.MeshPhysicalMaterial({color:'#ffffff', transparent:true, opacity:0.05, roughness:0.1}));
    s.position.set(0,DY,-0.239 + i*0.08); scene.add(s);
  }
  const glow = new THREE.PointLight('#ffe7bf', 5, 4); glow.position.set(0,DY,0.5); scene.add(glow);
}

// people: simple figures, about 1.7 m tall, standing 1.6-2.6 m from the wall
function person(x, z, h, col){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:0.8});
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, h*0.5, 6, 16), mat);
  body.position.y = h*0.42; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 24, 16), mat);
  head.position.y = h*0.42 + h*0.25 + 0.17 + 0.1; head.castShadow = true; g.add(head);
  g.position.set(x,0,z); scene.add(g);
}
const spots = [[0.2,1.6],[-0.55,2.0],[0.9,1.9],[-1.15,1.5],[1.45,1.45],[0.25,2.4]];
const cols = ['#b9b4ab','#9fa7ad','#c2ab95','#a6a29b','#b0a6b8','#9aa89a'];
const hs = [1.72,1.64,1.8,1.6,1.7,1.76];
for(let i=0;i<N;i++) person(spots[i][0], spots[i][1], hs[i], cols[i]);

renderer.render(scene, camera);
window.DONE = true;
</script></body></html>
